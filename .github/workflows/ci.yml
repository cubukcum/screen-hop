name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  # The installer is the one user-facing download and contains only the local desktop app. The
  # opt-in hardware spike remains a developer tool and is not packaged for end users.
  installer:
    name: installer (windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release -p screenhop-ui
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\screen-hop.iss'
      - name: SHA-256 the installer
        shell: pwsh
        run: |
          Get-FileHash installer\dist\screen-hop-setup.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, "screen-hop-setup.exe" } |
            Tee-Object -FilePath installer\dist\SHA256SUMS-installer.txt
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: screen-hop-installer
          path: |
            installer/dist/screen-hop-setup.exe
            installer/dist/SHA256SUMS-installer.txt
          if-no-files-found: error

  release:
    name: publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: installer
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: screen-hop-installer
          path: release-assets
      - name: Verify installer checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS-installer.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/screen-hop-setup.exe
          release-assets/SHA256SUMS-installer.txt
          --repo "$GITHUB_REPOSITORY"
          --title "screen-hop $GITHUB_REF_NAME"
          --notes-from-tag
          --prerelease
          --latest=false
          --verify-tag
